<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <mat-card class="login-card">
      
      <div class="card-header">
        <div class="icon-circle">
          <mat-icon>lock</mat-icon>
        </div>
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingrese usuario y contraseña</p>
      </div>

      <mat-card-content>
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Usuario</mat-label>
            <mat-icon matPrefix>person</mat-icon>
            <input matInput formControlName="username" placeholder="Ej: usuario123" />
            <mat-error *ngIf="username?.invalid">El usuario es requerido</mat-error>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <mat-icon matPrefix>vpn_key</mat-icon>
            <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="******" />
            <button mat-icon-button matSuffix type="button" (click)="hide = !hide" [attr.aria-label]="'Mostrar contraseña'">
              <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="passwordControl?.invalid">La contraseña es requerida</mat-error>
          </mat-form-field>
        </div>

        <div class="forgot-password">
          <a routerLink="/forgotPass">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="captcha-container">
          <re-captcha siteKey="6LfpC-ErAAAAAElCUyzRD1hS7p0VBHyK9RLOHV32" (resolved)="onCaptchaResolved($event)"></re-captcha>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button type="submit" class="btn-submit create-button" 
                [disabled]="!captchaValid || loginForm.invalid">
          INICIAR SESIÓN
        </button>
      </mat-card-actions>

      <div class="card-footer">
        <span>¿No tienes una cuenta?</span>
        <a routerLink="/register">Regístrate aquí</a>
      </div>

    </mat-card>
  </form>
</div>
