<div>

  <div class="title-crud">
    <h3>Especialidades</h3>
  </div>

  <div class="tabla-crud normal-table row">
    <table mat-table [dataSource]="especialidades" class="mat-elevation-z8">
      <!-- ID  -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef style="width: 10%;">ID</th>
        <td mat-cell *matCellDef="let row" style="width: 10%; text-align: center;">{{ row.id }}</td>
      </ng-container>

      <!-- User -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef style="width: 20%;">Nombre</th>
        <td mat-cell *matCellDef="let row" style="width: 30%; text-align: center;">{{ row.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="desc">
        <th mat-header-cell *matHeaderCellDef style="width: 30%;">Descripcion</th>
        <td mat-cell *matCellDef="let row" style="width: 20%; text-align: center;">
          {{ row.descripcion }}

        </td>
      </ng-container>

      <!--  Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width: 10%;">Acciones</th>
        <td mat-cell *matCellDef="let row" style="width: 10%; text-align: center;">
          <button class="showDetails" mat-icon-button color="primary" (click)="showDetails(row.id)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="openEditDialog(row.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="openDeleteDialog(row.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
