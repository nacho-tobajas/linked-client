<div class="screen">
  <button class="back-button" (click)="goBack()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="content" *ngIf="selectedTatuador"> 
    <h2 class="screen-title">Seleccionar Fecha</h2>
    <mat-calendar 
    [minDate]="minDate" 
    (selectedChange)="onDateSelected($event)">
    </mat-calendar>

    <h2 class="screen-title" style="margin-top: 2rem;">Horario</h2>
    
    <div *ngIf="isLoadingHorarios" class="horarios-feedback">
      <p>Buscando horarios disponibles...</p>
      </div>
    
    <div *ngIf="errorHorarios" class="horarios-feedback error">
      <p>{{ errorHorarios }}</p>
    </div>

    <div class="horarios-section" *ngIf="!isLoadingHorarios && !errorHorarios && horarios.length > 0">
      <button *ngFor="let horario of horarios" class="horario-btn" 
              [class.selected]="isTimeSelected(horario)"
              [disabled]="!selectedDate" 
              (click)="selectTime(horario)">
        {{ horario }}
      </button>
    </div>

    <h2 class="screen-title" style="margin-top: 2rem;">Describe tu idea</h2>
    <div class="descripcion-section">
      <textarea 
        class="descripcion-textarea"
        rows="4" 
        placeholder="Describe tu idea, tamaño (ej: 10x5 cm), zona del cuerpo..."
        [(ngModel)]="descripcionCliente"
        style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </textarea>
    </div>

    <h2 class="screen-title" style="margin-top: 2rem;">Sube tus ideas (máx {{maxFiles}})</h2>
    <div class="upload-section">
      <div class="preview-container">
        <div class="preview-item" *ngFor="let img of previewImages; let i = index">
          <img [src]="img" alt="Vista previa">
          <button class="remove-img-btn" (click)="removeImage(i)">×</button>
        </div>
      </div>
      <label class="upload-btn" *ngIf="selectedFiles.length < maxFiles">
        <input type="file" accept=".jpg, .jpeg, .png, .webp" hidden multiple (change)="onFileSelected($event)">
        Añadir imagen
      </label>
    </div>
    
    <button class="btn-confirm" [disabled]="!canConfirm()" (click)="confirmarReserva()">
      Confirmar Reserva
    </button>
  </div>
</div>
