<div class="screen-container">
  
  <div class="page-header">
    <button mat-icon-button (click)="goBack()" class="btn-back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="title-container">
      <h1>Seleccionar turno</h1>
    </div>
  </div>

  <div class="datos-container">
  <div *ngIf="selectedTatuador"> 
    
    <div class="section-title">
        <mat-icon>calendar_today</mat-icon> Elige una fecha
    </div>
    
    <mat-calendar 
      [minDate]="minDate" 
      (selectedChange)="onDateSelected($event)"
      [selected]="selectedDate">
    </mat-calendar>

    <div class="section-title" style="margin-top: 30px;">
        <mat-icon>schedule</mat-icon> Horarios Disponibles
    </div>
    
    <div *ngIf="isLoadingHorarios" class="horarios-feedback">
      <p>Buscando horarios...</p>
    </div>
    
    <div *ngIf="errorHorarios" class="horarios-feedback error">
      <p>{{ errorHorarios }}</p>
    </div>

    <div class="horarios-section" *ngIf="!isLoadingHorarios && !errorHorarios && horarios.length > 0">
      <button *ngFor="let horario of horarios" class="horario-btn" 
              [class.selected]="isTimeSelected(horario)"
              [disabled]="!selectedDate" 
              (click)="selectTime(horario)">
        {{ horario }}
      </button>
    </div>
    
    <div *ngIf="!isLoadingHorarios && !errorHorarios && horarios.length === 0 && selectedDate" class="horarios-feedback">
        No hay horarios disponibles para esta fecha.
    </div>

    <div class="section-title" style="margin-top: 30px;">
        <mat-icon>edit</mat-icon> Describe tu idea
    </div>
    
    <div class="descripcion-section">
      <textarea 
        class="descripcion-textarea"
        rows="4" 
        placeholder="Describe tu idea, tamaño (ej: 10x5 cm), zona del cuerpo..."
        [(ngModel)]="descripcionCliente">
      </textarea>
    </div>

    <div class="section-title" style="margin-top: 30px;">
        <mat-icon>photo_camera</mat-icon> Referencias (Máx {{maxFiles}})
    </div>

    <div class="upload-section">
      
      <div class="preview-container" *ngIf="previewImages.length > 0">
        <div class="preview-item" *ngFor="let img of previewImages; let i = index">
          <img [src]="img" alt="Vista previa">
          <button class="remove-img-btn" (click)="removeImage(i)">✕</button>
        </div>
      </div>
      
      <label class="upload-btn" *ngIf="selectedFiles.length < maxFiles" matRipple>
        <input type="file" accept="image/*" hidden multiple (change)="onFileSelected($event)">
        <mat-icon>add_photo_alternate</mat-icon>
        <span>Añadir imágenes</span>
      </label>
    </div>
    
    <button class="btn-confirm" 
            [disabled]="!canConfirm() || isSaving" 
            (click)="confirmarReserva()">
        <span *ngIf="!isSaving">Confirmar Reserva</span>
        <span *ngIf="isSaving">Procesando...</span>
    </button>

  </div>
  </div>
</div>
