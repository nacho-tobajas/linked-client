<h2 mat-dialog-title>Subir Nuevo Trabajo</h2>

<mat-dialog-content>
  <div class="upload-container">
    
    <p class="hint-text">Comparte tu arte con la comunidad. (Máx {{maxFiles}} fotos)</p>

    <div class="previews-grid" *ngIf="previewUrls.length > 0">
      
      <div class="preview-item" *ngFor="let url of previewUrls; let i = index">
        <img [src]="url" alt="Preview">
        <button class="btn-remove" mat-icon-button color="warn" (click)="removeImage(i)" matTooltip="Quitar foto">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      
      <div class="add-more-box" 
           *ngIf="previewUrls.length < maxFiles" 
           (click)="fileInput.click()"
           matRipple>
        <mat-icon>add_photo_alternate</mat-icon>
        <span>Agregar</span>
      </div>

    </div>

    <div class="placeholder" 
         *ngIf="previewUrls.length === 0" 
         (click)="fileInput.click()"
         matRipple>
      <mat-icon>cloud_upload</mat-icon>
      <h3>Haz clic para seleccionar fotos</h3>
      <p>Soporta JPG, PNG, WEBP</p>
    </div>

    <input #fileInput type="file" hidden multiple accept="image/*" (change)="onFileSelected($event)">

    <mat-form-field appearance="outline" class="full-width mt-3">
      <mat-label>Descripción / Pie de foto</mat-label>
      <textarea matInput 
                [(ngModel)]="descripcion" 
                rows="3" 
                placeholder="Ej: Manga estilo japonés realizado en 3 sesiones..."
                [disabled]="isUploading"></textarea>
      <mat-hint align="end">{{descripcion.length}} / 500</mat-hint>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isUploading">Cancelar</button>
  
  <button mat-raised-button color="primary" 
          [disabled]="selectedFiles.length === 0 || isUploading" 
          (click)="subir()">
    
    <ng-container *ngIf="!isUploading">
        <mat-icon>publish</mat-icon> Publicar
    </ng-container>
    
    <ng-container *ngIf="isUploading">
        <mat-spinner diameter="20" style="display:inline-block; margin-right: 5px"></mat-spinner> 
        Subiendo...
    </ng-container>

  </button>
</mat-dialog-actions>
