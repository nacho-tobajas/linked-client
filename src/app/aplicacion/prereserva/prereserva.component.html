<div class="mobile-container">
  
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="avatar">L</div>
      <span class="brand">{{ nombreUsuario }}</span>
    </div>
    <div class="wallet-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 6v6l4 2"></path>
      </svg>
    </div>
  </header>

  <!-- Pantalla 1: Inicio / Búsqueda -->
  <div class="screen" [class.active]="step === 'inicio'">
    <button class="back-button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="content">
      <div class="search-section">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" placeholder="Buscar tatuador..." class="search-input">
        </div>
      </div>

      <div class="options-grid">
        <button class="option-card" (click)="goToListado()">
          <div class="option-icon">OP1</div>
          <span class="option-label">Ver Tatuadores</span>
        </button>
        <button class="option-card">
          <div class="option-icon">OP2</div>
          <span class="option-label">Mis Reservas</span>
        </button>
        <button class="option-card">
          <div class="option-icon">OP3</div>
          <span class="option-label">Favoritos</span>
        </button>
        <button class="option-card">
          <div class="option-icon">OP4</div>
          <span class="option-label">Historial</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Pantalla 2: Listado de Tatuadores -->
  <div class="screen" [class.active]="step === 'listado'">
    <button class="back-button" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="content">
      <h2 class="screen-title">LISTADO</h2>

      <div class="tatuadores-list">
        <div 
          class="tatuador-item" 
          *ngFor="let tatuador of tatuadores"
          (click)="selectTatuador(tatuador)"
        >
          <img [src]="tatuador.imagen" [alt]="tatuador.nombre" class="tatuador-avatar">
          <div class="tatuador-info">
            <h3>{{ tatuador.nombre }}</h3>
            <p>{{ tatuador.especialidad }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pantalla 3: Selector Fecha y Horario -->
  <div class="screen" [class.active]="step === 'horarios'">
    <button class="back-button" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="content" *ngIf="selectedTatuador">
      <h2 class="screen-title">Fecha</h2>

      <app-calendario (dateSelected)="onDateSelected($event)"></app-calendario>

      <h2 class="screen-title" style="margin-top: 2rem;">Horario</h2>

      <div class="horarios-section">
        <button
          *ngFor="let horario of horarios"
          class="horario-btn"
          [class.selected]="isTimeSelected(horario)"
          [disabled]="!selectedDate"
          (click)="selectTime(horario)"
        >
          {{ horario }}
        </button>
      </div>

      <button 
        class="btn-confirm"
        [disabled]="!canConfirm()"
        (click)="confirmarReserva()"
      >
        Confirmar
      </button>
    </div>
  </div>

  <!-- Pantalla 4: Confirmación -->
  <div class="screen" [class.active]="step === 'confirmacion'">
    <button class="back-button" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="content confirmation-content">
      <h2 class="screen-title">Turno confirmado</h2>

      <div class="confirmation-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>

      <div class="confirmation-details">
        <div class="detail-line">
          <span class="detail-icon">👤</span>
          <span>{{ selectedTatuador?.nombre }}</span>
        </div>
        <div class="detail-line">
          <span class="detail-icon">📅</span>
          <span>{{ selectedDate }}</span>
        </div>
        <div class="detail-line">
          <span class="detail-icon">🕐</span>
          <span>{{ selectedTime }}</span>
        </div>
      </div>

      <button class="btn-done" (click)="volverInicio()">
        Listo
      </button>
    </div>
  </div>
