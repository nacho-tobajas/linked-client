<h2 class="especialidades-form">Asignar tus especialidades</h2>
<mat-form-field class="col-12 full-width" appearance="outline">
  <mat-label>Especialidades</mat-label>
  <mat-chip-grid #chipGrid>
    <mat-chip-row *ngFor="let especialidad of especialidades" removable="true" (removed)="removeEspecialidad(especialidad)">
      {{ especialidad.nombre }}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip-row>
    <input
      placeholder="Agregar especialidad..."
      [formControl]="especialidadCtrl"
      [matAutocomplete]="auto"
      [matChipInputFor]="chipGrid"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes">
  </mat-chip-grid>

  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="addEspecialidad($event)">
    <mat-option *ngFor="let e of filteredEspecialidades | async" [value]="e">
      {{ e.nombre }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
