<div class="home-container">
  
  <div class="welcome-section">
    <h1>Bienvenido</h1>
    <p>Encuentra tu próximo tatuaje</p>
  </div>

  <div class="quick-actions">
    
    <button class="option-card" routerLink="/reserva/listado" matTooltip="Nueva Reserva">
      <div class="icon-circle">
        <mat-icon>add_circle_outline</mat-icon>
      </div>
      <span>Reservar</span>
    </button>

    <button class="option-card" routerLink="/mis-reservas" matTooltip="Ver mis turnos">
      <div class="icon-circle">
        <mat-icon>calendar_today</mat-icon>
      </div>
      <span>Mis Turnos</span>
    </button>

    <button class="option-card" routerLink="/mis-favoritos" matTooltip="Mis trabajos guardados">
      <div class="icon-circle">
        <mat-icon>favorite</mat-icon>
      </div>
      <span>Favoritos</span>
    </button>

    <button class="option-card" matTooltip="Historial de tatuajes">
      <div class="icon-circle">
        <mat-icon>history</mat-icon>
      </div>
      <span>Historial</span>
    </button>

  </div>

  <mat-divider class="section-divider"></mat-divider>

  <div class="feed-section">
    <h3>Inspiración Reciente</h3>
    <div class="feed-placeholder">
        <p>Próximamente: Trabajos destacados de nuestros artistas.</p>
    </div>
  </div>

</div>
