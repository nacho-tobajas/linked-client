<div class="row">
  <button class="option-card">
    <mat-icon 
    matTooltip="Crear reserva de sesion"
    aria-label="Crear reserva de sesion"
    routerLink="/prereserva/listado">
      <span class="material-symbols-outlined"> assignment_add </span>
    </mat-icon>
  </button>

  <button class="option-card">
    <mat-icon 
          matTooltip="Mis reservas"
          aria-label="Mis reservas"
          (click)="goToMisReservas()">
      <span class="material-symbols-outlined"> assignment </span>
    </mat-icon>
  </button>

  <button class="option-card">
    <mat-icon aria-label="Mis reservas">
      <span class="material-symbols-outlined"> star </span>
    </mat-icon>
  </button>

  <button class="option-card">
    <mat-icon aria-label="Mis reservas">
      <span class="material-symbols-outlined"> history </span>
    </mat-icon>
  </button>
</div>
