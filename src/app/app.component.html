<app-header *ngIf="showShell"></app-header>

<div *ngIf="!showShell" class="floating-auth-actions">
  <button mat-icon-button routerLink="/inicio" aria-label="Ir al inicio">
    <mat-icon>home</mat-icon>
  </button>
  <app-theme-toggle-button></app-theme-toggle-button>
</div>

<div class="main-container">
  <app-sweitemmenu *ngIf="userLoginOn && userIsAdmin"></app-sweitemmenu>
  <div class="content-container">
    <app-loading-overlay *ngIf="isLoading$ | async"></app-loading-overlay>
    <router-outlet></router-outlet>
  </div>
</div>
<app-footer *ngIf="showShell"></app-footer>
